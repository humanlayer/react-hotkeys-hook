name: Publish to npm

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "package.json"

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm install --frozen-lockfile

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
        env:
          CI: true

      - name: Build
        run: npm run build

      - name: Verify dist contents
        run: |
          echo "Contents of packages/react-hotkeys-hook/dist/:"
          ls -la packages/react-hotkeys-hook/dist/
          if [ ! -f packages/react-hotkeys-hook/dist/index.js ]; then
            echo "ERROR: dist/index.js not found"
            exit 1
          fi
          if [ ! -f packages/react-hotkeys-hook/dist/index.d.ts ]; then
            echo "ERROR: dist/index.d.ts not found"
            exit 1
          fi

      # npm trusts humanlayer/react-hotkeys-hook's publish.yml (see PUBLISHING.md).
      # The CLI exchanges the GitHub OIDC token; no npm token secret is needed.
      - name: Publish to npm with OIDC
        run: npm publish --tolerate-republish
